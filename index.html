<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Trainings, Spieltermine und Vereinstermine des Vereins." />
    <meta name="theme-color" content="#0d9488" />
    <!--
      Hell ist die Voreinstellung. `only light` verbietet dem Browser, die Seite von sich
      aus abzudunkeln (Auto-Dark in Chrome und Samsung Internet) — das sähe aus wie ein
      Dark Mode, den niemand gewählt hat, und träfe Farben, die nie dunkel geprüft wurden.
      Wer dunkel will, stellt es unter „Mein Profil" um; dann setzt `.dark` das
      Farbschema per CSS selbst.
    -->
    <meta name="color-scheme" content="only light" />

    <!-- iOS liest das Manifest nicht; Symbol und Titel des Startbildschirms stehen hier. -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vereinsplaner" />

    <title>Vereinsplaner</title>

    <!-- Farbschema vor dem ersten Zeichnen setzen; Erklärung in public/theme-init.js. -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
