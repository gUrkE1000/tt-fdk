name: Deploy to GitHub Pages

# Nur manuell startbar, solange GitHub Pages und die Supabase-Secrets nicht eingerichtet
# sind (Aufgabe 0.3 im Umsetzungsplan). Danach hier wieder ergaenzen:
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      # Ohne diese Datei liefert GitHub Pages bei jedem Pfad ausser der Wurzel seine
      # eigene 404-Seite: Lesezeichen, Neuladen und jeder Link aus einer Benachrichtigung
      # landen im Nichts. Der Aufruf der Startseite funktioniert trotzdem — deshalb faellt
      # es beim Ausprobieren nicht auf, sondern erst bei den Mitgliedern.
      - name: SPA-Fallback pruefen
        run: |
          if [ ! -f dist/404.html ]; then
            echo "dist/404.html fehlt — scripts/spa-fallback.mjs lief nicht."
            echo "Ohne die Datei ist jeder tiefe Link auf der Seite kaputt."
            exit 1
          fi
          echo "dist/404.html vorhanden."

      # Guertel zum Hosentraeger. Die eigene Domain steht in den
      # Repository-Einstellungen (Settings -> Pages -> Custom domain); wird sie dort
      # versehentlich geleert, liefe die Seite wieder unter der github.io-Adresse — und
      # jeder Link in jeder Benachrichtigung zeigte ins Leere. Die Datei schreibt sie
      # noch einmal ins Artefakt.
      #
      # Quelle ist VITE_APP_URL, also derselbe Wert, der ohnehin gepflegt wird. Damit
      # gibt es keine zweite Stelle, an der beim Domainwechsel jemand nachziehen muesste.
      - name: Eigene Domain ins Artefakt schreiben
        env:
          APP_URL: ${{ secrets.VITE_APP_URL }}
        run: |
          host="${APP_URL#http://}"
          host="${host#https://}"
          host="${host%%/*}"
          if [ -n "$host" ]; then
            echo "$host" > dist/CNAME
            echo "Eigene Domain: $host"
          else
            echo "VITE_APP_URL ist leer — keine CNAME-Datei."
            echo "GitHub Pages nutzt dann die Einstellung aus dem Repository."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1