name: Deploy to Cloudflare Pages

# Ausgeliefert wird ueber Cloudflare Pages, nicht GitHub Pages: Das Repository ist privat
# (die Sicherung in backup.yml verlangt das), und GitHub Pages gibt es fuer private
# Repositories nur mit einem bezahlten Plan.
#
# Gebaut wird trotzdem hier, nicht bei Cloudflare: So liegen alle VITE_*-Werte an einer
# Stelle (den Repository-Secrets), und die Build-Kennung im Bundle ist der Commit.
# Cloudflare bekommt nur das fertige dist/ per Direct Upload.
#
# Nur manuell startbar, solange Cloudflare Pages und die Supabase-Secrets nicht
# eingerichtet sind (Aufgabe 0.3 im Umsetzungsplan). Danach hier wieder ergaenzen:
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Name des Pages-Projekts. Als Repository-Variable ueberschreibbar; die
      # Voreinstellung ergibt die Adresse vereinsplaner.pages.dev.
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'vereinsplaner' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # VITE_APP_URL ist die Basis jedes Links, den die Anwendung verschickt (Anmeldung,
      # Passwort, Einladung). Ein Tippfehler hier faellt erst auf, wenn ein Mitglied auf
      # einen toten Link klickt — deshalb lieber jetzt abbrechen.
      - name: Build-Variablen pruefen
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
        run: |
          [ -n "$VITE_SUPABASE_URL" ] || { echo "Secret VITE_SUPABASE_URL fehlt."; exit 1; }
          case "$VITE_APP_URL" in
            https://*/) echo "VITE_APP_URL ohne Schraegstrich am Ende eintragen: $VITE_APP_URL"; exit 1 ;;
            https://*) echo "VITE_APP_URL: $VITE_APP_URL" ;;
            *) echo "VITE_APP_URL fehlt oder beginnt nicht mit https:// — '$VITE_APP_URL'"; exit 1 ;;
          esac

      - name: Build Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      # Cloudflare Pages behandelt ein Projekt OHNE 404.html auf oberster Ebene als
      # Single-Page-App und liefert fuer jeden unbekannten Pfad index.html mit Status 200.
      # Liegt dort eine 404.html, bekommt jeder tiefe Link (Lesezeichen, Neuladen, Link aus
      # einer Benachrichtigung) stattdessen Status 404. Der Aufruf der Startseite
      # funktioniert in beiden Faellen — deshalb faellt es beim Ausprobieren nicht auf.
      - name: SPA-Modus pruefen
        run: |
          if [ -f dist/404.html ]; then
            echo "dist/404.html darf es nicht geben — Cloudflare Pages schaltet sonst den SPA-Modus ab."
            exit 1
          fi
          if [ ! -f dist/_headers ]; then
            echo "dist/_headers fehlt — public/_headers wurde nicht mitkopiert."
            exit 1
          fi
          echo "SPA-Modus aktiv, _headers vorhanden."

      # Einmalig: Gibt es das Projekt noch nicht, legt der Schritt es an. Existiert es
      # schon, scheitert das Anlegen, und das ist gewollt. Klappt beides nicht (Token ohne
      # Recht, falsche Konto-ID), meldet es der naechste Schritt unmissverstaendlich.
      #
      # Die eigene Domain gehoert NICHT hierher, sondern ins Projekt (Workers & Pages →
      # Projekt → Custom domains). Cloudflare legt den DNS-Eintrag dann selbst an.
      - name: Pages-Projekt anlegen, falls noetig
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.147.0 pages project create "$PAGES_PROJECT" \
            --production-branch=main \
            || echo "Projekt $PAGES_PROJECT besteht bereits (oder Anlegen nicht moeglich)."

      # Von main aus ist das die produktive Fassung. Von jedem anderen Branch aus entsteht
      # nur eine Vorschau unter <branch>.<projekt>.pages.dev; die eigene Domain bleibt
      # unberuehrt.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.147.0 pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA"
