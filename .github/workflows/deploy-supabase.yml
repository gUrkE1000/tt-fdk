name: Supabase ausrollen

# Nur manuell startbar, solange es kein Supabase-Projekt gibt (Aufgabe 0.3 im
# Umsetzungsplan). Sobald das Projekt existiert und die Secrets gesetzt sind, kommt
# hier wieder ein Auslöser hinzu:
#
#   on:
#     push:
#       branches: [main]
#       paths: ['supabase/migrations/**', 'supabase/functions/**']
#
# Bis dahin würde der Workflow bei jedem Push scheitern und die CI-Anzeige unbrauchbar
# machen.
on:
  workflow_dispatch:
    inputs:
      migrations:
        description: 'Migrationen einspielen (supabase db push)'
        type: boolean
        default: true
      functions:
        description: 'Edge Functions ausrollen'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Fehlt ein Secret, meldet die CLI nur „required flag(s) not set" und lässt offen,
      # welches. Deshalb hier zuerst nachsehen und den Namen nennen.
      #
      # Die Projekt-Kennung wird unter zwei Namen akzeptiert: `SUPABASE_PROJECT_ID` und
      # `SUPABASE_PROJECT_REF`. Beide standen schon in der Anleitung, und ein Workflow,
      # der wegen eines Namensdrehers scheitert, hilft niemandem.
      - name: Secrets prüfen
        id: secrets
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ref="${PROJECT_ID:-$PROJECT_REF}"
          missing=0

          if [ -z "$ref" ]; then
            echo "  fehlt: SUPABASE_PROJECT_ID — die Projekt-Kennung aus der Dashboard-Adresse"
            echo "         https://supabase.com/dashboard/project/<DAS HIER>"
            missing=1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "  fehlt: SUPABASE_ACCESS_TOKEN — Supabase → Account Settings → Access Tokens"
            missing=1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "  fehlt: SUPABASE_DB_PASSWORD — das Datenbank-Passwort des Projekts"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "::error::Secrets fehlen. Anlegen unter Settings → Secrets and variables → Actions; welche, steht im Protokoll dieses Schritts."
            exit 1
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Projekt verbinden
        run: supabase link --project-ref "${{ steps.secrets.outputs.ref }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Migrationen einspielen
        if: ${{ inputs.migrations }}
        run: supabase db push

      - name: Edge Functions ausrollen
        if: ${{ inputs.functions }}
        # Jeder Ordner unter supabase/functions außer _shared ist eine Funktion.
        run: |
          shopt -s nullglob
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            echo "→ $name"
            supabase functions deploy "$name" --project-ref "${{ steps.secrets.outputs.ref }}"
          done
