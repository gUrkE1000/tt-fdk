name: Daily Webcal Sync

on:
  schedule:
    - cron: '0 4 * * *' # Every day at 04:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase Edge Function Sync
        run: |
          curl -i -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/sync-calendars" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "x-sync-secret: ${{ secrets.VITE_SYNC_SECRET }}"
